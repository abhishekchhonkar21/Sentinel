[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous incident-investigation agent for SRE copilot workflows"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["backend/libs/sentinel_core/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [
    "backend/libs/sentinel_core/src",
    "backend/apps/toy_system/common/src",
    "backend/apps/toy_system/external_payment_mock/src",
    "backend/apps/toy_system/inventory_service/src",
    "backend/apps/toy_system/payments_service/src",
    "backend/apps/toy_system/orders_service/src",
    "backend/apps/toy_system/api_gateway/src",
    "backend/services/detector/src",
    "backend/services/investigator/src",
    "backend/services/hypothesis_ranker/src",
    "backend/services/narrator/src",
    "backend/services/critic/src",
    "backend/services/orchestrator/src",
    "backend/apps/fault_injection/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "sentinel_core",
    "toy_system",
    "detector",
    "investigator",
    "hypothesis_ranker",
    "narrator",
    "critic",
    "orchestrator",
    "api_gateway",
    "fault_injection",
]
combine-as-imports = true
