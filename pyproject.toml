[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous incident-investigation agent for SRE copilot workflows"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["libs/sentinel_core/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "libs/sentinel_core/src",
    "services/detector/src",
    "services/investigator/src",
    "services/hypothesis_ranker/src",
    "services/narrator/src",
    "services/critic/src",
    "services/orchestrator/src",
    "apps/fault_injection/src",
]
