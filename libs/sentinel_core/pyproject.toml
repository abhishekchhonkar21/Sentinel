[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-core"
version = "0.1.0"
description = "Shared domain, ports, adapters, and infrastructure for Sentinel services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.10.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
